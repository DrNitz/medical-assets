name: Generate Custom Med JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Med_img/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run generator script
        run: python generate_med_json.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add custom_med_data.json || true
          git commit -m "Auto-update custom med JSON" || echo "No changes to commit"
          git push
